<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" role="img" aria-label="Approved templates in Registry and Anklet job flow">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#30638E"/>
    </marker>
    <style>
      .title { font: 600 16px system-ui, sans-serif; fill: #1f2937; }
      .section { font: 13px system-ui, sans-serif; fill: #374151; }
      .label { font: 13px system-ui, sans-serif; fill: #374151; }
      .small { font: 11px system-ui, sans-serif; fill: #6b7280; }
      .edge-label { font: 12px system-ui, sans-serif; fill: #30638E; }
      .step { fill: #ffffff; stroke: #624495; stroke-width: 2; }
      .registry { fill: #624495; stroke: #624495; stroke-width: 2; }
      .registry-text { font: 600 13px system-ui, sans-serif; fill: #ffffff; }
      .registry-sub { font: 12px system-ui, sans-serif; fill: #ffffff; }
      .orchestrator { fill: #30638E; stroke: #30638E; stroke-width: 2; }
      .orch-text { font: 600 12px system-ui, sans-serif; fill: #ffffff; }
      .orch-sub { font: 11px system-ui, sans-serif; fill: #ffffff; }
      .end { fill: #fef2f2; stroke: #e21e79; stroke-width: 2; }
      .connector { fill: none; stroke: #30638E; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>
  <rect width="900" height="320" fill="#f8fafc"/>
  <text x="450" y="28" text-anchor="middle" class="title">Template Catalog, Registry, and CI jobs</text>

  <rect x="48" y="52" width="200" height="252" rx="10" class="registry"/>
  <text x="148" y="118" text-anchor="middle" dominant-baseline="middle" class="registry-text">Anka Registry</text>
  <text x="148" y="142" text-anchor="middle" dominant-baseline="middle" class="registry-sub">Template Catalog</text>
  <text x="148" y="162" text-anchor="middle" dominant-baseline="middle" class="registry-sub">+ named tags</text>

  <text x="530" y="52" text-anchor="middle" class="section">Bank platform team</text>

  <rect x="360" y="64" width="340" height="96" rx="8" class="step"/>
  <text x="530" y="96" text-anchor="middle" dominant-baseline="middle" class="label">Approved base template</text>
  <text x="530" y="116" text-anchor="middle" dominant-baseline="middle" class="small">macOS + Xcode (change control)</text>
  <text x="530" y="136" text-anchor="middle" dominant-baseline="middle" class="small">published after review</text>

  <line x1="360" y1="112" x2="268" y2="112" class="connector" marker-end="url(#arrow)"/>
  <text x="314" y="100" text-anchor="middle" class="edge-label">publish</text>

  <text x="564" y="188" text-anchor="middle" class="section">CI jobs via Anklet</text>

  <rect x="276" y="200" width="128" height="56" rx="8" class="orchestrator"/>
  <text x="340" y="220" text-anchor="middle" dominant-baseline="middle" class="orch-text">Anklet</text>
  <text x="340" y="238" text-anchor="middle" dominant-baseline="middle" class="orch-sub">job queued</text>

  <rect x="436" y="200" width="168" height="56" rx="8" class="step"/>
  <text x="520" y="220" text-anchor="middle" dominant-baseline="middle" class="label">Pull + clone VM</text>
  <text x="520" y="238" text-anchor="middle" dominant-baseline="middle" class="small">pulls template/tag from Registry</text>

  <rect x="636" y="200" width="112" height="56" rx="8" class="step"/>
  <text x="692" y="228" text-anchor="middle" dominant-baseline="middle" class="label">Build runs</text>

  <rect x="780" y="200" width="72" height="56" rx="8" class="end"/>
  <text x="816" y="228" text-anchor="middle" dominant-baseline="middle" class="label">VM deleted</text>

  <line x1="404" y1="228" x2="432" y2="228" class="connector" marker-end="url(#arrow)"/>
  <line x1="604" y1="228" x2="632" y2="228" class="connector" marker-end="url(#arrow)"/>
  <line x1="748" y1="228" x2="776" y2="228" class="connector" marker-end="url(#arrow)"/>

  <path d="M 268 286 H 520 V 256" class="connector" marker-end="url(#arrow)"/>
  <text x="396" y="300" text-anchor="middle" class="edge-label">pull tag</text>
</svg>
