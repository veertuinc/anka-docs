<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 200" role="img" aria-label="Line-of-business CI on bank-controlled Mac nodes">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#30638E"/>
    </marker>
    <style>
      .title { font: 600 16px system-ui, sans-serif; fill: #1f2937; }
      .label { font: 14px system-ui, sans-serif; fill: #374151; }
      .small { font: 12px system-ui, sans-serif; fill: #6b7280; }
      .pill { fill: #ffffff; stroke: #624495; stroke-width: 2; }
      .hub { fill: #624495; }
      .hub-text { font: 600 14px system-ui, sans-serif; fill: #ffffff; }
    </style>
  </defs>
  <rect width="820" height="200" fill="#f8fafc"/>
  <text x="410" y="36" text-anchor="middle" class="title">Who uses the bank Mac fleet</text>

  <rect x="40" y="68" width="200" height="72" rx="36" class="pill"/>
  <text x="140" y="98" text-anchor="middle" class="label">Line-of-business CI</text>
  <text x="140" y="120" text-anchor="middle" class="small">GitHub Actions</text>

  <rect x="310" y="68" width="200" height="72" rx="36" class="hub"/>
  <text x="410" y="98" text-anchor="middle" class="hub-text">On-prem Mac pool</text>
  <text x="410" y="120" text-anchor="middle" class="hub-text">Private network</text>

  <rect x="580" y="68" width="200" height="72" rx="36" class="pill"/>
  <text x="680" y="98" text-anchor="middle" class="label">Bank platform team</text>
  <text x="680" y="120" text-anchor="middle" class="small">Approved templates, tags</text>

  <line x1="240" y1="104" x2="310" y2="104" stroke="#30638E" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="580" y1="104" x2="510" y2="104" stroke="#30638E" stroke-width="2" marker-end="url(#arrow)"/>
</svg>
