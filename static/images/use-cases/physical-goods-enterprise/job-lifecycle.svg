<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" role="img" aria-label="Registry, central IT base and brand tags, CI job with simulator tests in VM">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#30638E"/>
    </marker>
    <style>
      .title { font: 600 16px system-ui, sans-serif; fill: #1f2937; }
      .section { font: 13px system-ui, sans-serif; fill: #374151; }
      .label { font: 13px system-ui, sans-serif; fill: #374151; }
      .small { font: 11px system-ui, sans-serif; fill: #6b7280; }
      .edge-label { font: 12px system-ui, sans-serif; fill: #30638E; }
      .step { fill: #ffffff; stroke: #624495; stroke-width: 2; }
      .registry { fill: #624495; stroke: #624495; stroke-width: 2; }
      .registry-text { font: 600 13px system-ui, sans-serif; fill: #ffffff; }
      .registry-sub { font: 12px system-ui, sans-serif; fill: #ffffff; }
      .end { fill: #fef2f2; stroke: #e21e79; stroke-width: 2; }
      .connector { fill: none; stroke: #30638E; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>
  <rect width="900" height="320" fill="#f8fafc"/>
  <text x="450" y="28" text-anchor="middle" class="title">Template Catalog, Registry, and brand CI jobs</text>

  <rect x="48" y="52" width="220" height="252" rx="10" class="registry"/>
  <text x="158" y="118" text-anchor="middle" dominant-baseline="middle" class="registry-text">Anka Registry</text>
  <text x="158" y="142" text-anchor="middle" dominant-baseline="middle" class="registry-sub">Template Catalog</text>
  <text x="158" y="162" text-anchor="middle" dominant-baseline="middle" class="registry-sub">base + brand tags</text>

  <text x="530" y="52" text-anchor="middle" class="section">Central IT</text>

  <rect x="360" y="64" width="340" height="96" rx="8" class="step"/>
  <text x="530" y="92" text-anchor="middle" dominant-baseline="middle" class="label">Base + brand tags</text>
  <text x="530" y="112" text-anchor="middle" dominant-baseline="middle" class="small">macOS, Xcode, iOS Simulator runtimes</text>
  <text x="530" y="132" text-anchor="middle" dominant-baseline="middle" class="small">brand signing and SDKs on child tags</text>

  <line x1="360" y1="112" x2="268" y2="112" class="connector" marker-end="url(#arrow)"/>
  <text x="314" y="100" text-anchor="middle" class="edge-label">publish</text>

  <text x="564" y="188" text-anchor="middle" class="section">CI jobs</text>

  <rect x="276" y="200" width="128" height="56" rx="8" class="step"/>
  <text x="340" y="220" text-anchor="middle" dominant-baseline="middle" class="label">CI request</text>
  <text x="340" y="238" text-anchor="middle" dominant-baseline="middle" class="small">target tag name</text>

  <rect x="436" y="200" width="168" height="56" rx="8" class="step"/>
  <text x="520" y="220" text-anchor="middle" dominant-baseline="middle" class="label">VM starts</text>
  <text x="520" y="238" text-anchor="middle" dominant-baseline="middle" class="small">pulls template/tag if needed</text>

  <rect x="636" y="200" width="132" height="56" rx="8" class="step"/>
  <text x="702" y="220" text-anchor="middle" dominant-baseline="middle" class="label">Build + simulators</text>
  <text x="702" y="238" text-anchor="middle" dominant-baseline="middle" class="small">inside the VM</text>

  <rect x="788" y="200" width="72" height="56" rx="8" class="end"/>
  <text x="824" y="228" text-anchor="middle" dominant-baseline="middle" class="label">VM deleted</text>

  <line x1="404" y1="228" x2="432" y2="228" class="connector" marker-end="url(#arrow)"/>
  <line x1="604" y1="228" x2="632" y2="228" class="connector" marker-end="url(#arrow)"/>
  <line x1="768" y1="228" x2="786" y2="228" class="connector" marker-end="url(#arrow)"/>

  <path d="M 268 286 H 520 V 256" class="connector" marker-end="url(#arrow)"/>
  <text x="396" y="300" text-anchor="middle" class="edge-label">pull tag</text>
</svg>
