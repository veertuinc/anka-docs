<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" role="img" aria-label="Orchestrator clones imported template, job switches toolchain version, VM terminated">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#30638E"/>
    </marker>
    <style>
      .title { font: 600 16px system-ui, sans-serif; fill: #1f2937; }
      .section { font: 13px system-ui, sans-serif; fill: #374151; }
      .label { font: 13px system-ui, sans-serif; fill: #374151; }
      .small { font: 11px system-ui, sans-serif; fill: #6b7280; }
      .step { fill: #ffffff; stroke: #624495; stroke-width: 2; }
      .orchestrator { fill: #624495; stroke: #624495; stroke-width: 2; }
      .orch-text { font: 600 12px system-ui, sans-serif; fill: #ffffff; }
      .orch-sub { font: 11px system-ui, sans-serif; fill: #ffffff; }
      .base { fill: #f5f3ff; stroke: #624495; stroke-width: 2; }
      .end { fill: #fef2f2; stroke: #e21e79; stroke-width: 2; }
      .connector { fill: none; stroke: #30638E; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>
  <rect width="900" height="340" fill="#f8fafc"/>
  <text x="450" y="28" text-anchor="middle" class="title">Job flow via provider orchestrator</text>

  <rect x="48" y="56" width="188" height="68" rx="8" class="base"/>
  <text x="142" y="82" text-anchor="middle" dominant-baseline="middle" class="label">Imported template</text>
  <text x="142" y="102" text-anchor="middle" dominant-baseline="middle" class="small">on host disk (one tag)</text>

  <text x="556" y="56" text-anchor="middle" class="section">Per customer job</text>

  <!-- Row 1: y=72, h=56, gap=24 between boxes -->
  <rect x="268" y="72" width="128" height="56" rx="8" class="orchestrator"/>
  <text x="332" y="92" text-anchor="middle" dominant-baseline="middle" class="orch-text">Orchestrator</text>
  <text x="332" y="108" text-anchor="middle" dominant-baseline="middle" class="orch-sub">job arrives</text>

  <rect x="420" y="72" width="128" height="56" rx="8" class="step"/>
  <text x="484" y="92" text-anchor="middle" dominant-baseline="middle" class="label">Clone VM</text>
  <text x="484" y="108" text-anchor="middle" dominant-baseline="middle" class="small">from local template</text>

  <rect x="572" y="72" width="128" height="56" rx="8" class="step"/>
  <text x="636" y="92" text-anchor="middle" dominant-baseline="middle" class="label">Start VM</text>
  <text x="636" y="108" text-anchor="middle" dominant-baseline="middle" class="small">ephemeral runner</text>

  <line x1="396" y1="100" x2="418" y2="100" class="connector" marker-end="url(#arrow)"/>
  <line x1="548" y1="100" x2="570" y2="100" class="connector" marker-end="url(#arrow)"/>
  <path d="M 236 90 H 266" class="connector" marker-end="url(#arrow)"/>

  <!-- Row 2: y=220, h=56, gap=28 (82px below row 1) -->
  <rect x="268" y="220" width="236" height="56" rx="8" class="step"/>
  <text x="386" y="240" text-anchor="middle" dominant-baseline="middle" class="label">Switch toolchain</text>
  <text x="386" y="256" text-anchor="middle" dominant-baseline="middle" class="small">Xcode / nvm command at job start</text>

  <rect x="532" y="220" width="136" height="56" rx="8" class="step"/>
  <text x="600" y="248" text-anchor="middle" dominant-baseline="middle" class="label">Customer build</text>

  <rect x="696" y="220" width="136" height="56" rx="8" class="end"/>
  <text x="764" y="248" text-anchor="middle" dominant-baseline="middle" class="label">VM terminated</text>

  <line x1="504" y1="248" x2="530" y2="248" class="connector" marker-end="url(#arrow)"/>
  <line x1="668" y1="248" x2="694" y2="248" class="connector" marker-end="url(#arrow)"/>

  <!-- Start VM → Switch toolchain -->
  <path d="M 636 128 V 184 H 386 V 220" class="connector" marker-end="url(#arrow)"/>
</svg>
