<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" role="img" aria-label="CI requests cache template with latest tag; Controller resolves and node pulls to run job">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#30638E"/>
    </marker>
    <style>
      .title { font: 600 16px system-ui, sans-serif; fill: #1f2937; }
      .section { font: 13px system-ui, sans-serif; fill: #374151; }
      .label { font: 13px system-ui, sans-serif; fill: #374151; }
      .small { font: 11px system-ui, sans-serif; fill: #6b7280; }
      .edge-label { font: 12px system-ui, sans-serif; fill: #30638E; }
      .label-bg { fill: #f8fafc; }
      .step { fill: #ffffff; stroke: #624495; stroke-width: 2; }
      .controller { fill: #624495; stroke: #624495; stroke-width: 2; }
      .controller-text { font: 600 12px system-ui, sans-serif; fill: #ffffff; }
      .controller-sub { font: 11px system-ui, sans-serif; fill: #ffffff; }
      .registry { fill: #624495; stroke: #624495; stroke-width: 2; }
      .registry-text { font: 600 13px system-ui, sans-serif; fill: #ffffff; }
      .registry-sub { font: 12px system-ui, sans-serif; fill: #ffffff; }
      .end { fill: #fef2f2; stroke: #e21e79; stroke-width: 2; }
      .connector { fill: none; stroke: #30638E; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>
  <rect width="900" height="340" fill="#f8fafc"/>
  <text x="450" y="28" text-anchor="middle" class="title">Daytime CI jobs (template + latest)</text>

  <!-- Registry (left, spans both rows) -->
  <rect x="48" y="52" width="200" height="268" rx="10" class="registry"/>
  <text x="148" y="160" text-anchor="middle" dominant-baseline="middle" class="registry-text">Anka Registry</text>
  <text x="148" y="184" text-anchor="middle" dominant-baseline="middle" class="registry-sub">Title cache template</text>
  <text x="148" y="204" text-anchor="middle" dominant-baseline="middle" class="registry-sub">+ nightly tags</text>

  <text x="564" y="52" text-anchor="middle" class="section">Daytime CI jobs</text>

  <!-- Row 1: CI request, Controller, VM starts — 3 boxes, 60px gaps, x 280–880 -->
  <rect x="280" y="68" width="160" height="56" rx="8" class="step"/>
  <text x="360" y="88" text-anchor="middle" dominant-baseline="middle" class="label">CI request</text>
  <text x="360" y="106" text-anchor="middle" dominant-baseline="middle" class="small">cache template + latest</text>

  <rect x="500" y="68" width="160" height="56" rx="8" class="controller"/>
  <text x="580" y="88" text-anchor="middle" dominant-baseline="middle" class="controller-text">Controller</text>
  <text x="580" y="106" text-anchor="middle" dominant-baseline="middle" class="controller-sub">resolves latest tag</text>

  <rect x="720" y="68" width="160" height="56" rx="8" class="step"/>
  <text x="800" y="88" text-anchor="middle" dominant-baseline="middle" class="label">VM starts</text>
  <text x="800" y="106" text-anchor="middle" dominant-baseline="middle" class="small">repo already on disk</text>

  <line x1="440" y1="96" x2="496" y2="96" class="connector" marker-end="url(#arrow)"/>
  <line x1="660" y1="96" x2="716" y2="96" class="connector" marker-end="url(#arrow)"/>

  <!-- Row 2: git pull + build, VM deleted — 2 boxes, 60px gap, same outer width -->
  <rect x="280" y="248" width="270" height="56" rx="8" class="step"/>
  <text x="415" y="276" text-anchor="middle" dominant-baseline="middle" class="label">git pull + build</text>

  <rect x="610" y="248" width="270" height="56" rx="8" class="end"/>
  <text x="745" y="276" text-anchor="middle" dominant-baseline="middle" class="label">VM deleted</text>

  <line x1="550" y1="276" x2="606" y2="276" class="connector" marker-end="url(#arrow)"/>

  <!-- VM starts to git pull + build -->
  <path d="M 800 124 V 200 H 550 V 248" class="connector" marker-end="url(#arrow)"/>

  <!-- Pull from Registry into bottom of VM starts -->
  <path d="M 248 168 H 800 V 124" class="connector" marker-end="url(#arrow)"/>
  <rect x="476" y="150" width="108" height="16" rx="3" class="label-bg"/>
  <text x="530" y="162" text-anchor="middle" class="edge-label">pull resolved tag</text>
</svg>
